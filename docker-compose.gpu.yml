services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DEVICE_TYPE=gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

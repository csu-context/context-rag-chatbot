services:
  # RAG Chatbot 애플리케이션 서비스
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-chatbot-app
    # 소스 코드 및 데이터 동기화를 위한 볼륨 설정
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./.cache:/app/.cache
      - ./.env:/app/.env
    # .env 파일 로드
    env_file:
      - .env
    environment:
      - CHROMA_SERVER_HOST=chromadb
      - CHROMA_SERVER_PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - HF_HOME=/app/models
    ports:
      - "8501:8501"
    # ChromaDB 및 Ollama 서버가 준비될 때까지 대기
    depends_on:
      - chromadb
      - ollama
    # 호스트 Native Ollama 연동을 위한 호스트 게이트웨이 매핑
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rag-network


  # Ollama 서비스 (로컬 sLLM 엔진)
  ollama:
    image: ollama/ollama:latest
    container_name: rag-chatbot-ollama
    volumes:
      - ./models/ollama:/root/.ollama
      - ./docker/ollama_init.sh:/root/ollama_init.sh
    ports:
      - "11434:11434"
    env_file:
      - .env
    entrypoint: ["/bin/bash", "/root/ollama_init.sh"]

    networks:
      - rag-network


  # ChromaDB 서버 전용 컨테이너 (벡터 DB 관리)
  chromadb:
    image: chromadb/chroma:latest
    container_name: rag-chatbot-chromadb
    volumes:
      - ./vector_db:/data
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
    networks:
      - rag-network
    # ChromaDB 리소스 한도
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    restart: unless-stopped
    # ChromaDB healthcheck — app 기동 순서 보장
    # chromadb/chroma 이미지에는 python/curl/wget이 없고(최소 이미지) v1 API도 제거됨 →
    # bash /dev/tcp로 8000 포트 TCP 연결만 확인한다(서버 바인딩=수신 준비, API 버전 무관).
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Redis 세션 스토어 — 수평 확장 시 대화 연속성 유지
  redis:
    image: redis:7-alpine
    container_name: rag-chatbot-redis
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  rag-network:
    driver: bridge

volumes:
  redis-data:
    driver: local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-chatbot-app
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - model-cache:/app/models        # Issue 23: named volume — root 소유 충돌 방지
      - ./logs:/app/logs
      - ./.cache:/app/.cache
      - ./.env:/app/.env
    env_file:
      - .env
    environment:
      - CHROMA_SERVER_HOST=chromadb
      - CHROMA_SERVER_PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - HF_HOME=/app/models
      # Issue 12: Redis 세션 스토어 (수평 확장 시 활성화)
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8501:8501"
    # Issue 16: healthcheck 조건 기반 depends_on
    depends_on:
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_started
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rag-network
    # Issue 9: 리소스 한도 / Issue 17: 무중단 배포 rolling update
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
        reservations:
          memory: 512m
      update_config:
        order: start-first       # 새 컨테이너 기동 후 구 컨테이너 종료
        failure_action: rollback  # 실패 시 자동 롤백
        monitor: 30s
      rollback_config:
        order: stop-first
    restart: unless-stopped
    # Issue 16: app 자체 healthcheck
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ollama:
    image: ollama/ollama:latest
    container_name: rag-chatbot-ollama
    volumes:
      - ./models/ollama:/root/.ollama
      - ./docker/ollama_init.sh:/root/ollama_init.sh
    ports:
      - "11434:11434"
    env_file:
      - .env
    entrypoint: ["/bin/bash", "/root/ollama_init.sh"]
    networks:
      - rag-network
    # Issue 9: Ollama GPU/CPU 리소스 한도
    deploy:
      resources:
        limits:
          memory: 8g
        reservations:
          memory: 2g
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: rag-chatbot-chromadb
    volumes:
      # Issue 6: named volume — 컨테이너 재시작 시 데이터 유실 방지
      - chroma-data:/data
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
    networks:
      - rag-network
    # Issue 9: ChromaDB 리소스 한도
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    restart: unless-stopped
    # Issue 16: ChromaDB healthcheck — app 기동 순서 보장
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Issue 12: Redis 세션 스토어 — 수평 확장 시 대화 연속성 유지
  redis:
    image: redis:7-alpine
    container_name: rag-chatbot-redis
    volumes:
      - redis-data:/data
    networks:
      - rag-network
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  rag-network:
    driver: bridge

volumes:
  # Issue 6: 영속 볼륨 — 인프라 업데이트 시 데이터 유실 방지
  chroma-data:
    driver: local
  # Issue 23: 모델 캐시 named volume — Docker non-root 권한 충돌 방지
  model-cache:
    driver: local
  # Issue 12: Redis 세션 영속화
  redis-data:
    driver: local
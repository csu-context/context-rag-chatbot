services:
  # RAG Chatbot 애플리케이션 서비스
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-chatbot-app
    # 소스 코드 및 데이터 동기화를 위한 볼륨 설정
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./.env:/app/.env
    # .env 파일 로드
    env_file:
      - .env
    environment:
      - CHROMA_SERVER_HOST=chromadb
      - CHROMA_SERVER_PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - HF_HOME=/app/models
    ports:
      - "8501:8501"
    # ChromaDB 및 Ollama 서버가 준비될 때까지 대기
    depends_on:
      - chromadb
      - ollama
    # [주의] NVIDIA GPU 가속 설정
    # AWS GPU 인스턴스(g4dn) 환경에서는 아래 deploy 섹션이 활성화되어야 합니다.
    # 단, MacBook(M1/M2/M3) 또는 GPU가 없는 로컬 환경에서 실행할 경우 
    # 아래 'deploy' 섹션 전체를 반드시 주석 처리해야 컨테이너가 정상 기동됩니다.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks:
      - rag-network


  # Ollama 서비스 (로컬 sLLM 엔진)
  ollama:
    image: ollama/ollama:latest
    container_name: rag-chatbot-ollama
    volumes:
      - ./models/ollama:/root/.ollama
      - ./scripts/ollama_init.sh:/root/ollama_init.sh
    ports:
      - "11434:11434"
    env_file:
      - .env
    entrypoint: ["/bin/bash", "/root/ollama_init.sh"]
    # [주의] NVIDIA GPU 가속 설정
    # MacBook 또는 CPU 전용 환경에서는 아래 'deploy' 섹션을 주석 처리하세요.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks:
      - rag-network


  # ChromaDB 서버 전용 컨테이너 (벡터 DB 관리)
  chromadb:
    image: chromadb/chroma:latest
    container_name: rag-chatbot-chromadb
    volumes:
      - ./vector_db:/data
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

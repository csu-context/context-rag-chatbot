services:
  # RAG Chatbot 애플리케이션 서비스
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-chatbot-app
    # 소스 코드 및 데이터 동기화를 위한 볼륨 설정
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./.cache:/app/.cache
      - ./.env:/app/.env
      - ./config:/app/config
    # .env 파일 로드
    env_file:
      - .env
    environment:
      - CHROMA_SERVER_HOST=chromadb
      - CHROMA_SERVER_PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - HF_HOME=/app/models
    ports:
      - "8501:8501"
      - "9090:9090"
    # ChromaDB 및 Ollama 서버가 준비될 때까지 대기
    depends_on:
      - chromadb
      - ollama
    # 호스트 Native Ollama 연동을 위한 호스트 게이트웨이 매핑
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rag-network
    # Issue 30/43: 로그 로테이션 + 레이블 기반 중앙 수집 (Loki/Fluentd 연동 가능)
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service,version"
    labels:
      - "service=rag-app"
      - "version=1.0"


  # Ollama 서비스 (로컬 sLLM 엔진)
  ollama:
    image: ollama/ollama:latest
    container_name: rag-chatbot-ollama
    volumes:
      - ./models/ollama:/root/.ollama
      - ./docker/ollama_init.sh:/root/ollama_init.sh
    ports:
      - "11434:11434"
    env_file:
      - .env
    entrypoint: ["/bin/bash", "/root/ollama_init.sh"]

    networks:
      - rag-network


  # ChromaDB 서버 전용 컨테이너 (벡터 DB 관리)
  chromadb:
    image: chromadb/chroma:latest
    container_name: rag-chatbot-chromadb
    volumes:
      - ./vector_db:/data
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

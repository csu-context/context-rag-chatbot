[tool.ruff]
# Ruff 설정: 린트(Linting) 및 포맷팅(Formatting) 통합 관리
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# 규칙 선택 (Linting)
# E/W: pycodestyle (에러/경고)
# F: Pyflakes (치명적 오류)
# I: isort (임포트 정렬)
# B: flake8-bugbear (잠재적 버그 방지)
# UP: pyupgrade (최신 파이썬 문법 제안)
# C90: mccabe (코드 복잡도 검사)
# SIM: flake8-simplify (코드 단순화 제안)
# PYI: flake8-pyi (타이핑 관련 에러)
# N: pep8-naming (명명 규칙 검사)
# RUF: ruff-specific rules (Ruff 전용 규칙)
select = ["E", "F", "I", "W", "B", "UP", "C90", "SIM", "PYI", "N", "RUF"]
ignore = []

[tool.ruff.lint.isort]
# Isort 관련 설정
combine-as-imports = true
force-wrap-aliases = true

[tool.ruff.format]
# Black 스타일의 포맷터 설정
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.mccabe]
# 코드 복잡도 임계값 설정 (기본 10)
max-complexity = 10

[tool.pytest.ini_options]
# 기본 테스트 경로: unit 테스트만 포함
# e2e 테스트(src/tests/e2e/)는 실서버(ChromaDB) 없이 실행 시 segfault 발생하므로
# 별도로 `pytest src/tests/e2e/` 명령으로 수동 실행합니다.
testpaths = ["src/tests/unit"]
python_files = "test_*.py"
addopts = "--strict-markers"
markers = [
    "e2e: 실서버(ChromaDB) 연동이 필요한 end-to-end 테스트",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/tests/*",
    "src/__init__.py",
    "*/__init__.py",
    "src/app.py",
    "src/utils/health_check.py",
    "src/eval/**",
    "src/main.py",
    "src/utils/monitoring.py"
]


[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80  # 테스트 품질 유지를 위해 80%로 상향
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError"
]

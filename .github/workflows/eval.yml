name: RAG E2E Eval Pipeline

# Issue 29: CI/CD RAG E2E 자동 평가 파이프라인
on:
  schedule:
    - cron: "0 2 * * 1"  # 매주 월요일 02:00 UTC
  workflow_dispatch:
    inputs:
      eval_samples:
        description: "평가 샘플 수"
        default: "20"
        required: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "requirements.txt"

      - name: Install dependencies
        run: |
          uv pip install --system --index-strategy unsafe-best-match -r requirements.txt
          uv pip install --system ragas datasets pytest pytest-mock pytest-asyncio

      - name: Run E2E RAG Eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EVAL_MAX_SAMPLES: ${{ github.event.inputs.eval_samples || '20' }}
          CI: "true"
          ALLOW_EXTERNAL_API: "true"
        run: |
          python -m pytest src/tests/e2e/ -v --durations=10 -k "not performance"
          python scripts/generate_eval_dataset.py
          python scripts/run_ragas_eval.py

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_number }}
          path: logs/
          retention-days: 30
name: Python Test Suite

on:
  pull_request:
    branches: [ "develop", "main" ]
  push:
    branches: [ "develop", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Fix DNS (github.com 해석 실패 방지)
      run: |
        echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
        echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf

    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "requirements.txt"

    - name: Install dependencies
      run: |
        uv pip install --system --index-strategy unsafe-best-match -r requirements.txt
        uv pip install --system pytest pytest-mock pytest-cov pytest-asyncio

    - name: Run Tests with Coverage
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        TESTING: "true"
        CI: "true"
      run: |
        # --cov=src: src 폴더의 커버리지 측정
        # --cov-report=term-missing: 누락된 라인을 터미널에 표시
        python -m pytest --cov=src --cov-report=term-missing --durations=5

